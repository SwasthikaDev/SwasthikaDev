name: Update Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and generate retro language SVG
        env:
          GH_PAT: ${{ secrets.PROFILE_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          token = os.environ['GH_PAT']
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'profile-stats'}

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          user = fetch('https://api.github.com/user')
          public_repos = user.get('public_repos', 0)
          private_repos = user.get('total_private_repos', 0)
          owned_private = user.get('owned_private_repos', 0)
          total = public_repos + private_repos

          repos = []
          page = 1
          while True:
              batch = fetch(f'https://api.github.com/user/repos?per_page=100&visibility=all&affiliation=owner&page={page}')
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          lang_bytes = {}
          for repo in repos:
              if repo.get('fork'):
                  continue
              try:
                  langs = fetch(repo['languages_url'])
                  for lang, bc in langs.items():
                      lang_bytes[lang] = lang_bytes.get(lang, 0) + bc
              except Exception as e:
                  print(f"Skip {repo.get('full_name')}: {e}")

          total_bytes = sum(lang_bytes.values()) or 1
          top = sorted(lang_bytes.items(), key=lambda x: -x[1])[:5]
          print('Top languages:', top)

          os.makedirs('data', exist_ok=True)
          with open('data/profile-stats.json', 'w') as f:
              json.dump({
                  'public_repos': public_repos,
                  'private_repos': private_repos,
                  'owned_private_repos': owned_private,
                  'total_repos': total,
                  'top_languages': [{'name': n, 'bytes': b, 'pct': round(b/total_bytes*100, 2)} for n, b in top],
                  'updated_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              }, f, indent=2)

          colors = {
              'Python': '#3572A5', 'JavaScript': '#f1e05a', 'TypeScript': '#3178c6',
              'Jupyter Notebook': '#DA5B0B', 'Dart': '#00B4AB', 'HTML': '#e34c26',
              'CSS': '#563d7c', 'Java': '#b07219', 'C++': '#f34b7d', 'C': '#555555',
              'Shell': '#89e051', 'Go': '#00ADD8', 'Rust': '#dea584', 'Swift': '#F05138',
              'Kotlin': '#A97BFF', 'Ruby': '#701516', 'PHP': '#4F5D95', 'Dockerfile': '#384d54',
              'Vue': '#41b883', 'Solidity': '#AA6746', 'Lua': '#000080'
          }

          os.makedirs('assets', exist_ok=True)

          def render(theme):
              if theme == 'light':
                  fg, empty, accent = '#212529', '#e9ecef', '#0d6efd'
              else:
                  fg, empty, accent = '#f8f9fa', '#21262d', '#ffc107'
              W = 480
              row_h = 30
              H = 32 + 14 + len(top) * row_h + 12
              parts = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" shape-rendering="crispEdges">']
              # Title (no box, no background, no border)
              parts.append(f'<text x="{W//2}" y="22" font-family="\'Courier New\', monospace" font-weight="bold" font-size="16" fill="{accent}" text-anchor="middle" letter-spacing="2">&#9733; MY LEVELS &#9733;</text>')
              for i, (lang, bc) in enumerate(top):
                  y = 32 + 14 + i * row_h
                  pct = (bc / total_bytes) * 100
                  filled = max(1, round((bc / total_bytes) * 20))
                  color = colors.get(lang, '#6c757d')
                  label = lang.upper() if len(lang) <= 13 else lang.upper()[:12] + '.'
                  parts.append(f'<text x="0" y="{y+14}" font-family="\'Courier New\', monospace" font-weight="bold" font-size="11" fill="{fg}">{label}</text>')
                  bar_x = 155
                  for seg in range(20):
                      seg_x = bar_x + seg * 11
                      fill = color if seg < filled else empty
                      parts.append(f'<rect x="{seg_x}" y="{y+3}" width="9" height="14" fill="{fill}"/>')
                  pct_str = f'{pct:5.1f}%'
                  parts.append(f'<text x="{W}" y="{y+14}" font-family="\'Courier New\', monospace" font-weight="bold" font-size="11" fill="{fg}" text-anchor="end">{pct_str}</text>')
              parts.append('</svg>')
              return '\n'.join(parts)

          with open('assets/languages.svg', 'w') as f:
              f.write(render('light'))
          with open('assets/languages-dark.svg', 'w') as f:
              f.write(render('dark'))
          print('SVGs written.')
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile-stats.json assets/languages.svg assets/languages-dark.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile stats and languages SVG"
            git push
          fi
